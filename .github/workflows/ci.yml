name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch or pull request cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep in sync with .fvmrc.
  FLUTTER_VERSION: 3.47.5
  # The oldest supported Flutter. Keep in sync with `environment` in pubspec.yaml.
  MIN_FLUTTER_VERSION: 3.32.0

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Get dependencies
        run: flutter pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test example/lib tool
      - name: Analyze the package
        run: flutter analyze
      - name: Check that every example in the docs compiles
        run: dart run tool/check_snippets.dart
      - name: Analyze the example
        working-directory: example
        run: |
          flutter pub get
          flutter analyze
      - name: Check that the API reference builds
        run: dart doc --dry-run
      - name: Check that the package can be published
        run: flutter pub publish --dry-run

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Get dependencies
        run: flutter pub get
      - name: Run tests with coverage
        run: flutter test --coverage
      - name: Coverage summary
        run: |
          total=$(grep -h '^LF:' coverage/lcov.info | cut -d: -f2 | paste -sd+ | bc)
          hit=$(grep -h '^LH:' coverage/lcov.info | cut -d: -f2 | paste -sd+ | bc)
          echo "### Coverage: $hit of $total lines ($(echo "scale=2; 100 * $hit / $total" | bc)%)" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/lcov.info

  test-min:
    name: Test (minimum Flutter)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.MIN_FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Get dependencies
        run: flutter pub get
      # Proves the lower bound in pubspec.yaml: the package compiles and behaves on it.
      - name: Run tests
        run: flutter test
      - name: Check that the example compiles
        working-directory: example
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings

  build-example:
    name: Build example
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Test the example
        working-directory: example
        run: |
          flutter pub get
          flutter test
      - name: Build the example for the web
        working-directory: example
        run: flutter build web --release
