name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: Code to reproduce
      description: The smallest piece of code that shows the problem.
      render: dart
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console output
      description: Any `[FluentBar]` message from the debug console or your error handler, and the stack trace if there is one.
      render: text
  - type: input
    id: version
    attributes:
      label: fluent_bar version
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: flutter
    attributes:
      label: Flutter version
      description: The first line of `flutter --version`.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options: [Android, iOS, Web, Windows, macOS, Linux]
    validations:
      required: true
